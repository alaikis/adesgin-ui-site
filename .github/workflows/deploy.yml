name: Deploy AlaiDesign Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout AlaiDesign source
        uses: actions/checkout@v4
        with:
          repository: alaikis/alai-desgin
          path: source/AlaiDesign

      - name: Build @alaikis/alaidesign-web
        run: |
          cd source/AlaiDesign
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build --workspace=@alaikis/alaidesign-web

      - name: Link Web Components core into vendor
        run: |
          mkdir -p vendor/alaidesign-web
          cp -r source/AlaiDesign/packages/core/. vendor/alaidesign-web/
          # 本地开发用：若 node_modules 中无 @alaikis/alaidesign-web symlink，手动建
          node -e "
            const fs=require('fs'),path=require('path');
            const nm=path.resolve('node_modules/@alaikis');
            if(fs.existsSync(nm)){
              fs.rmSync(path.join(nm,'alaidesign-web'),{recursive:true,force:true});
              fs.symlinkSync(path.resolve('vendor/alaidesign-web'),path.join(nm,'alaidesign-web'),'dir');
            }
          "

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          PAGES_BASE: /

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
