name: Deploy AlaiDesign Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            source/AlaiDesign/package-lock.json
            package-lock.json

      - name: Checkout AlaiDesign source
        uses: actions/checkout@v4
        with:
          repository: alaikis/alai-desgin
          path: source/AlaiDesign

      - name: Build @alaikis/alaidesign-web
        run: |
          cd source/AlaiDesign
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build --workspace=@alaikis/alaidesign-web

      - name: Link Web Components core into vendor
        run: |
          mkdir -p vendor/alaidesign-web
          cp -r source/AlaiDesign/packages/core/. vendor/alaidesign-web/
          rm -rf node_modules/@alaikis/alaidesign-web
          node -e "
            const fs=require('fs'),path=require('path');
            fs.mkdirSync(path.join('node_modules/@alaikis'),{recursive:true});
            fs.rmSync(path.join('node_modules/@alaikis/alaidesign-web'),{recursive:true,force:true});
            fs.symlinkSync(path.resolve('vendor/alaidesign-web'),path.join('node_modules/@alaikis/alaidesign-web'),'dir');
          "

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          PAGES_BASE: /

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
