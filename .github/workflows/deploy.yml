name: Deploy AlaiDesign Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official site
        uses: actions/checkout@v4

      - name: Checkout AlaiDesign source
        uses: actions/checkout@v4
        with:
          repository: alaikis/alai-desgin
          ref: ai/Administrator/alaidesign-website-multi-framework
          path: source/AlaiDesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build @alaikis/alaidesign-ui
        run: |
          cd source/AlaiDesign
          npm install --legacy-peer-deps
          npm run build --workspace=@alaikis/alaidesign-ui

      - name: Build official site
        run: npm run build
        env:
          PAGES_BASE: /

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
